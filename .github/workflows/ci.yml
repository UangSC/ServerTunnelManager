name: Cross-platform checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Check shared assets and publishable source
        run: |
          node scripts/sync-shared.mjs
          node scripts/audit-repository.mjs
      - name: Test Node backend, CLI, shortcuts and sync
        run: node --test portable/TunnelStudio/tests/*.test.mjs tests/sync.test.mjs
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Check shared assets and publishable source
        shell: pwsh
        run: |
          node scripts/sync-shared.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/audit-repository.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows PowerShell 5.1 HTTP receiver tests
        shell: powershell
        run: |
          try {
            & .\tests\http.tests.ps1
          } catch {
            $detail = ($_.Exception.Message + ' stack ' + $_.ScriptStackTrace) -replace '[\r\n]+', ' '
            Write-Host "::error file=tests/http.tests.ps1::$detail"
            exit 1
          }
      - name: Windows PowerShell 5.1 port ownership tests
        shell: powershell
        run: |
          try {
            & .\tests\ports.tests.ps1
          } catch {
            $detail = ($_.Exception.Message + ' stack ' + $_.ScriptStackTrace) -replace '[\r\n]+', ' '
            Write-Host "::error file=tests/ports.tests.ps1::$detail"
            exit 1
          }
      - name: Windows shortcuts and API security tests
        shell: powershell
        run: |
          try {
            & .\tests\windows-integration.tests.ps1
          } catch {
            $detail = ($_.Exception.Message + ' stack ' + $_.ScriptStackTrace) -replace '[\r\n]+', ' '
            Write-Host "::error file=tests/windows-integration.tests.ps1::$detail"
            exit 1
          }
      - name: Shared CLI against isolated Windows backend
        shell: powershell
        run: |
          try {
            & .\tests\windows-api.tests.ps1
          } catch {
            $detail = ($_.Exception.Message + ' stack ' + $_.ScriptStackTrace) -replace '[\r\n]+', ' '
            Write-Host "::error file=tests/windows-api.tests.ps1::$detail"
            exit 1
          }
